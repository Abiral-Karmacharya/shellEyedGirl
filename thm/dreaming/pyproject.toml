[project]
name = "dreaming"
version = "0.1.0"
description = "Thm box for dreaming"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "requests"
]

[project.scripts]
dreaming = "dreaming:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "venv",
]
